[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "python -m workers.railway_entrypoint"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"

[environments.worker.deploy]
startCommand = "python -m workers.heartbeat --scheduled"
cronSchedule = "0 6 * * *"
restartPolicyType = "NEVER"
